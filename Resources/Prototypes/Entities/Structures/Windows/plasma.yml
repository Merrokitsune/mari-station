- type: entity
  id: PlasmaWindow
  name: plasma window
  parent: [BaseDeltaPressurePlasma, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrier]
  components:
  - type: Sprite
    sprite: _Maristation/Structures/Windows/window-plasma.rsi # Mari
  - type: Icon
    sprite: _Maristation/Structures/Windows/window-plasma.rsi # Mari
    state: full
  - type: Damageable
    damageModifierSet: GlassPlasmaMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 2
  - type: IconSmooth
    base: pwindow
  - type: Construction
    graph: Window
    node: plasmaWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: _Maristation/Structures/Windows/cracks.rsi # Mari
  - type: StaticPrice
    price: 100
  - type: RadiationBlocker
    resistance: 2

- type: entity
  id: PlasmaWindowDirectional
  parent: [BaseDeltaPressurePlasmaQuarter, BaseWindowStructureDirectional, BaseRCDResistant, StructureHealthBarrierWeak]
  name: directional plasma window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: _Maristation/Structures/Windows/directional.rsi # Mari
    state: plasma_window
  - type: Icon
    sprite: _Maristation/Structures/Windows/directional.rsi # Mari
    state: plasma_window
  - type: Construction
    graph: WindowDirectional
    node: plasmaWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 1.5
    trackAllDamage: true
    damageOverlay:
      sprite: _Maristation/Structures/Windows/cracks_directional.rsi # Mari
  - type: Damageable
    damageModifierSet: GlassPlasmaMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 1
  - type: StaticPrice
    price: 50
  - type: RadiationBlocker
    resistance: 1

- type: entity
  parent: PlasmaWindowDirectional
  id: PlasmaWindowDirectionalCorner
  suffix: Corner
  components:
  - type: Sprite
    sprite: _Maristation/Structures/Windows/directional.rsi # Mari
    state: plasma_window_corner
  - type: Icon
    sprite: _Maristation/Structures/Windows/directional.rsi # Mari
    state: plasma_window_corner
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.28125,-0.28125"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: WindowDirectionalCorner
    node: plasmaWindowDirectionalCorner
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    trackAllDamage: true
    damageOverlay:
      sprite: _Maristation/Structures/Windows/cracks_directional_corner.rsi # Mari

- type: entity
  parent: PlasmaWindow
  id: PlasmaWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Maristation/Structures/Windows/window-diagonal-plasma.rsi # Mari
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: _Maristation/Structures/Windows/window-diagonal-plasma.rsi # Mari
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: _Maristation/Structures/Windows/cracks-diagonal.rsi # Mari
  - type: Construction
    graph: WindowDiagonal
    node: plasmaWindowDiagonal
