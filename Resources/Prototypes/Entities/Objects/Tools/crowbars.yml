- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCrowbar
  name: crowbar
  description: A multipurpose tool used for many tasks, such as prying doors or bludgeoning interdimensional invaders.
  components:
  - type: EmitSoundOnPickup # Funky
    sound:
      path: /Audio/_Funkystation/Items/Handling/crowbar_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop # Funky
    sound:
      path: /Audio/_Funkystation/Items/Handling/crowbar_drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - Crowbar
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalThud
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 22
  - type: Prying
  - type: Sprite
    sprite: _Maristation/Objects/Tools/crowbar.rsi # Mari
  - type: Clothing
    sprite: _Maristation/Objects/Tools/crowbar.rsi # Mari
    quickEquip: false
    slots:
    - Belt
  - type: Item
    sprite: _Maristation/Objects/Tools/crowbar.rsi # Mari
    size: Small

# Standard (grey) Crowbar
- type: entity
  parent: BaseCrowbar
  id: Crowbar
  components:
  - type: Sprite
    state: icon
  - type: Item
    storedSprite:
      sprite: _Maristation/Objects/Tools/crowbar.rsi # Mari
      state: storage

# Emergency (red) Crowbar
- type: entity
  parent: BaseCrowbar
  id: CrowbarRed
  components:
  - type: Tag
    tags:
    - Crowbar
    - CrowbarRed
  - type: Sprite
    layers:
    - state: icon
    - state: cover-icon
      color: "#990000"
  - type: Item
    sprite: _Maristation/Objects/Tools/crowbar.rsi # Mari
    storedRotation: -45 # Mari
    # \/ \/ Maristation Start.
    #storedSprite:
    #  state: red-storage
    #  sprite: _Funkystation/Objects/Tools/crowbar.rsi # Funky
    inhandVisuals:
      left:
      - state: inhand-left
      - state: cover-inhand-left
        color: "#990000"
      right:
      - state: inhand-right
      - state: cover-inhand-right
        color: "#990000"
  - type: Clothing
    clothingVisuals:
      belt:
      - state: equipped-BELT
      - state: cover-equipped-BELT
        color: "#990000"

